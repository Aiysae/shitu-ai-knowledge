name: Publish Shitu AI images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: shitu-ai-ui
            context: frontend
            file: frontend/Dockerfile
            target: ""
            suffix: ""
          - image: shitu-ai-app
            context: .
            file: docker/Dockerfile.app
            target: ""
            suffix: ""
          - image: shitu-ai-docreader
            context: .
            file: docker/Dockerfile.docreader
            target: ""
            suffix: ""
          # 沙箱四个变体对应 internal/sandbox/sandbox.go 里的默认镜像
          # （main、main-cube、main-desktop、main-desktop-cube）。
          - image: shitu-ai-sandbox
            context: .
            file: docker/Dockerfile.sandbox
            target: sandbox
            suffix: ""
          - image: shitu-ai-sandbox
            context: .
            file: docker/Dockerfile.sandbox
            target: cube
            suffix: -cube
          - image: shitu-ai-sandbox
            context: .
            file: docker/Dockerfile.sandbox
            target: desktop
            suffix: -desktop
          - image: shitu-ai-sandbox
            context: .
            file: docker/Dockerfile.sandbox
            target: desktop-cube
            suffix: -desktop-cube
    steps:
      - uses: actions/checkout@v6
      - id: identity
        shell: bash
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
          version=$(tr -d '\r\n' < VERSION)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          repo="ghcr.io/$owner/${{ matrix.image }}"
          suffix="${{ matrix.suffix }}"
          {
            echo 'tags<<EOF'
            echo "$repo:$version$suffix"
            echo "$repo:main$suffix"
            if [ -z "$suffix" ]; then echo "$repo:latest"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.tags }}
          build-args: |
            WITH_ANYDOC=0
            VERSION_ARG=${{ steps.identity.outputs.version }}
            COMMIT_ID_ARG=${{ github.sha }}
            VITE_FRONTEND_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=势途AI企业级知识库
            org.opencontainers.image.description=由Vantage万极维护并开源
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
